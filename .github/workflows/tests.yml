name: Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push to a branch with an open pull request triggers both events:
# keep one run per ref and cancel the one it replaces.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, API and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Bun installs the packages and runs every tool (Playwright, ESLint, tsc). Node.js is not used.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cheapest checks first, so a typo fails in seconds, not after the browser download.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Loads every spec and fixture without starting a browser: catches broken imports.
      - name: List tests
        run: bun run test --list

      # The browser download is cached per Playwright version. The Linux packages Chromium
      # needs are installed into the OS, so they are installed on every run.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(bun -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium from cache
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bunx --bun playwright install --with-deps chromium

      - name: Install Chromium system packages
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: bunx --bun playwright install-deps chromium

      - name: Run tests
        run: bun run test

      # The HTML report embeds traces and screenshots. Uploaded on failure too:
      # that is when it is needed most.
      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
